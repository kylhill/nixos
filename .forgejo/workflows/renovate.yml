---
name: Renovate

"on":
  schedule:
    - cron: "47 9 * * 5"
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: renovate-${{ forgejo.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: docker.io/renovate/renovate:latest@sha256:03e987bec9fbda0cf39ef63f2d293e821d96525119e1ab3d0ff87d5b3ef3edd9
      volumes:
        - /opt/renovate-cache:/tmp/renovate/containerbase
    env:
      LOG_LEVEL: info
      RENOVATE_CONTAINERBASE_DIR: /tmp/renovate/containerbase
      RENOVATE_ENDPOINT: https://git.tacomafia.net/api/v1
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_HOST_RULES: '[{"hostType":"forgejo","matchHost":"https://git.tacomafia.net/","allowInternal":true}]'
      RENOVATE_INTERNAL_HOST_ACCESS: block
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORIES: kylhill/nixos
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Update dependencies
        run: renovate
