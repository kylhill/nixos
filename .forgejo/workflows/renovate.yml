---
name: Maintenance

"on":
  schedule:
    - cron: "47 9 * * 5"
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: maintenance-${{ forgejo.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Update dependencies
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: docker.io/renovate/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
      volumes:
        - /opt/cache/renovate:/tmp/renovate/cache
    env:
      LOG_LEVEL: info
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
      RENOVATE_ENDPOINT: https://git.tacomafia.net/api/v1
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_HOST_RULES: '[{"hostType":"forgejo","matchHost":"https://git.tacomafia.net/","allowInternal":true}]'
      RENOVATE_INTERNAL_HOST_ACCESS: block
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_REPOSITORIES: kylhill/nixos
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Update dependencies
        run: renovate

  flake-check:
    name: Weekly validation
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      volumes:
        - /opt/cache/nix:/nix
    defaults:
      run:
        shell: bash
    steps:
      - name: Install job prerequisites
        shell: sh
        run: |
          # Bash is needed by subsequent steps and the Nix installer action.
          # GNU tools keep the installer and persistent-cache operations consistent.
          apk add --no-cache bash ca-certificates coreutils curl findutils git sudo tar xz
          git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          enable_kvm: false

      - name: Retain development environment
        run: |
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          cache_key="$(sha256sum flake.lock flake.nix | sha256sum | cut -d ' ' -f 1)"
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          cache_root="$cache_roots/nixos-$cache_key"
          nix build ".#devShells.$system.default" --out-link "$cache_root"
          touch -h "$cache_root"

      - name: Validate repository
        run: nix develop --command ./test.sh --ci

      - name: Maintain Nix cache
        if: always()
        run: |
          if ! command -v nix-store >/dev/null; then
            exit 0
          fi
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          # Expire inactive environments; GC runs weekly, not after every job.
          find "$cache_roots" -maxdepth 1 -type l -mtime +14 -delete
          marker=/nix/var/nix/ci-last-gc
          if [[ ! -e "$marker" ]] || [[ -n "$(find "$marker" -mtime +6 -print)" ]]; then
            nix-store --gc
            touch "$marker"
          fi
