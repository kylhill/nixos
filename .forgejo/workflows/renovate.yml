---
name: Renovate

"on":
  schedule:
    - cron: "47 9 * * 5"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - .forgejo/workflows/renovate.yml
      - flake.nix

enable-email-notifications: true

concurrency:
  group: renovate-${{ forgejo.event.pull_request.number || forgejo.repository }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  renovate:
    if: forgejo.event_name != 'pull_request'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: &renovate_image docker.io/renovate/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
      volumes:
        - /opt/cache/renovate:/tmp/renovate/cache
    env:
      LOG_LEVEL: info
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
      RENOVATE_ENDPOINT: https://git.tacomafia.net/api/v1
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_HOST_RULES: '[{"hostType":"forgejo","matchHost":"https://git.tacomafia.net/","allowInternal":true}]'
      RENOVATE_INTERNAL_HOST_ACCESS: block
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_REPOSITORIES: kylhill/nixos
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Update dependencies
        run: renovate

  renovate-config:
    if: forgejo.event_name == 'pull_request' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 10
    container:
      image: *renovate_image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        run: renovate-config-validator --strict --no-global renovate.json

      - name: Check matching distribution releases
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('flake.nix', 'utf8');
          const references = [
            /github:NixOS\/nixpkgs\/nixos-(\d{2}\.\d{2})"/g,
            /github:nix-community\/home-manager\/release-(\d{2}\.\d{2})"/g,
            /github:nix-community\/nixvim\/nixos-(\d{2}\.\d{2})"/g,
          ];
          const releases = references.map(pattern => {
            const matches = [...source.matchAll(pattern)];
            assert.equal(matches.length, 1, `Expected one release reference: ${pattern}`);
            return matches[0][1];
          });
          assert.equal(new Set(releases).size, 1,
            'Nixpkgs, Home Manager and Nixvim releases must match');
          JS
