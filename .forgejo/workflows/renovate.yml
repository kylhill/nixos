---
name: Maintenance

"on":
  schedule:
    - cron: "47 9 * * 5"
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: maintenance-${{ forgejo.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Update dependencies
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: docker.io/renovate/renovate:44.222.1@sha256:11492804bf7b54707c658c02f6b0f25fcf8448b5e13d4b549d4df7af04e285e4
      volumes:
        - /opt/cache/renovate:/tmp/renovate/cache
    env:
      LOG_LEVEL: info
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
      RENOVATE_ENDPOINT: https://git.tacomafia.net/api/v1
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_HOST_RULES: '[{"hostType":"forgejo","matchHost":"https://git.tacomafia.net/","allowInternal":true}]'
      RENOVATE_INTERNAL_HOST_ACCESS: block
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_REPOSITORIES: kylhill/nixos
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Update dependencies
        run: renovate

  flake-check:
    name: Weekly validation
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      volumes:
        # Share binary archives; /nix and its database remain job-local.
        - /opt/cache/nix:/opt/cache/nix
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git
        run: git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false

      - name: Validate repository
        run: bash scripts/ci/with-nix-cache.sh ./test.sh --ci
