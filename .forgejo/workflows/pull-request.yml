---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: nixos-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Validate repository
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      volumes:
        # Share binary archives; /nix and its database remain job-local.
        - /opt/cache/nix:/opt/cache/nix
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git
        run: git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false

      - name: Validate repository
        run: bash scripts/ci/with-nix-cache.sh ./test.sh --ci
