---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: nixos-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Validate repository
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      volumes:
        # Share binary archives; /nix and its database remain job-local.
        - /opt/cache/nix:/opt/cache/nix
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git
        run: git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false

      - name: Validate repository
        run: bash scripts/ci/with-nix-cache.sh ./test.sh --ci

  renovate-config:
    name: Configuration
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 10
    container:
      image: docker.io/renovate/renovate:44.222.1@sha256:11492804bf7b54707c658c02f6b0f25fcf8448b5e13d4b549d4df7af04e285e4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        run: renovate-config-validator --strict --no-global renovate.json

      - name: Check matching distribution releases
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('flake.nix', 'utf8');
          const references = [
            /github:NixOS\/nixpkgs\/nixos-(\d{2}\.\d{2})"/g,
            /github:nix-community\/home-manager\/release-(\d{2}\.\d{2})"/g,
            /github:nix-community\/nixvim\/nixos-(\d{2}\.\d{2})"/g,
          ];
          const releases = references.map(pattern => {
            const matches = [...source.matchAll(pattern)];
            assert.equal(matches.length, 1, `Expected one release reference: ${pattern}`);
            return matches[0][1];
          });
          assert.equal(new Set(releases).size, 1,
            'Nixpkgs, Home Manager and Nixvim releases must match');
          JS
