---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

jobs:
  flake-check:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes ca-certificates curl git sudo xz-utils
          git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Validate repository
        run: ./test.sh --ci
