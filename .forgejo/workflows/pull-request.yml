---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: nixos-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Validate repository
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      volumes:
        - /opt/cache/nix:/nix
    defaults:
      run:
        shell: bash
    steps:
      - name: Install job prerequisites
        shell: sh
        run: |
          # Bash is needed by subsequent steps and the Nix installer action.
          # GNU tools keep the installer and persistent-cache operations consistent.
          apk add --no-cache bash ca-certificates coreutils curl findutils git sudo tar xz
          git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          enable_kvm: false

      - name: Retain development environment
        run: |
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          cache_key="$(sha256sum flake.lock flake.nix | sha256sum | cut -d ' ' -f 1)"
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          cache_root="$cache_roots/nixos-$cache_key"
          nix build ".#devShells.$system.default" --out-link "$cache_root"
          touch -h "$cache_root"

      - name: Validate repository
        run: nix develop --command ./test.sh --ci

      - name: Maintain Nix cache
        if: always()
        run: |
          if ! command -v nix-store >/dev/null; then
            exit 0
          fi
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          # Expire inactive environments; GC runs weekly, not after every job.
          find "$cache_roots" -maxdepth 1 -type l -mtime +14 -delete
          marker=/nix/var/nix/ci-last-gc
          if [[ ! -e "$marker" ]] || [[ -n "$(find "$marker" -mtime +6 -print)" ]]; then
            nix-store --gc
            touch "$marker"
          fi

  renovate-config:
    name: Configuration
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 10
    container:
      image: docker.io/renovate/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        run: renovate-config-validator --strict --no-global renovate.json

      - name: Check matching distribution releases
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('flake.nix', 'utf8');
          const references = [
            /github:NixOS\/nixpkgs\/nixos-(\d{2}\.\d{2})"/g,
            /github:nix-community\/home-manager\/release-(\d{2}\.\d{2})"/g,
            /github:nix-community\/nixvim\/nixos-(\d{2}\.\d{2})"/g,
          ];
          const releases = references.map(pattern => {
            const matches = [...source.matchAll(pattern)];
            assert.equal(matches.length, 1, `Expected one release reference: ${pattern}`);
            return matches[0][1];
          });
          assert.equal(new Set(releases).size, 1,
            'Nixpkgs, Home Manager and Nixvim releases must match');
          JS
