---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: nixos-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake-check:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: docker.io/library/node:lts-bookworm-slim@sha256:91acba91b842bec0bf7ea6f5e09c644c7ccad72c4996ed9616d861d1c7cd60d4
      volumes:
        - /opt/cache/nix:/nix
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes ca-certificates curl git sudo xz-utils
          git config --system init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          enable_kvm: false

      - name: Retain development environment
        run: |
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          cache_key="$(sha256sum flake.lock flake.nix | sha256sum | cut -d ' ' -f 1)"
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          cache_root="$cache_roots/nixos-$cache_key"
          nix build ".#devShells.$system.default" --out-link "$cache_root"
          touch -h "$cache_root"

      - name: Validate repository
        run: nix develop --command ./test.sh --ci

      - name: Maintain Nix cache
        if: always()
        run: |
          if ! command -v nix-store >/dev/null; then
            exit 0
          fi
          cache_roots=/nix/var/nix/gcroots/ci
          mkdir -p "$cache_roots"
          # Expire inactive environments; GC runs weekly, not after every job.
          find "$cache_roots" -maxdepth 1 -type l -mtime +14 -delete
          marker=/nix/var/nix/ci-last-gc
          if [[ ! -e "$marker" ]] || [[ -n "$(find "$marker" -mtime +6 -print)" ]]; then
            nix-store --gc
            touch "$marker"
          fi
