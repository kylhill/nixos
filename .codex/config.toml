# Keep repository work sandboxed while allowing the daemonless evaluation
# script to write its local store under /tmp and fetch locked inputs.
approval_policy = "on-request"
default_permissions = "nixos"

[features]
network_proxy = true

[permissions.nixos]
description = "Workspace access plus network access for daemonless Nix evaluation."
extends = ":workspace"

[permissions.nixos.network]
enabled = true

[permissions.nixos.network.domains]
"**.github.com" = "allow"
"cache.nixos.org" = "allow"
