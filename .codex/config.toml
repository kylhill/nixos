approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "nixos-development"

[permissions.nixos-development]
description = "Workspace access with network access for Nix validation"
extends = ":workspace"

[permissions.nixos-development.network]
enabled = true

[permissions.nixos-development.network.unix_sockets]
"/nix/var/nix/daemon-socket/socket" = "allow"

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.set]
NIX_CACHE_HOME = "/tmp/nixos-codex-nix-cache"
NIX_REMOTE = "daemon"

[mcp_servers.nixos]
command = "mcp-nixos"

[mcp_servers.nixos.tools.nix]
approval_mode = "approve"
